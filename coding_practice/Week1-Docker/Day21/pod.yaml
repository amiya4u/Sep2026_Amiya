apiVersion: v1
kind: Pod
metadata:
  name: task-pv-pod
spec:
  volumes:
    - name: task-storage
      persistentVolumeClaim:
        claimName: task-pv-claim
  containers:
    - name: task-pv-containers
      image: nginx
      volumeMounts:
        - mountPath: "/data"
          name: task-storage
