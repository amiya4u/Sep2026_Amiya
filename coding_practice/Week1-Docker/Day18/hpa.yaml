apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: day18-deploy-hpa
spec:
  maxReplicas: 5
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: day18-deploy
  minReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
