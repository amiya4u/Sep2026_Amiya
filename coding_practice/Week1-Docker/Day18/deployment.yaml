apiVersion: apps/v1
kind: Deployment
metadata:
  name: day18-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx-app
          image: nginx
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "200m"
