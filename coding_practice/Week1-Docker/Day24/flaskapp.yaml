apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-deployment   
  template:
    metadata:
      labels:
        app: flask-deployment  
    spec:
      containers:
        - name: flask-deployment
          image: amiya4u/flask-capstone:v2
    
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  selector:
    app: flask-deployment   
  ports:
    - port: 80
      targetPort: 5000
  
