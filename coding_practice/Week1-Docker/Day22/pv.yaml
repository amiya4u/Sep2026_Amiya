apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-0
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/pv-0"


